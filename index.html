<!DOCTYPE html>
<htl lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 14.02.2027</title>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyARnPbOhMIUMbK9MCPhCixwFkGPYxKP91E",
            authDomain: "f27-e1de3.firebaseapp.com",
            databaseURL: "https://f27-e1de3-default-rtdb.firebaseio.com",
            projectId: "f27-e1de3",
            storageBucket: "f27-e1de3.firebasestorage.app",
            messagingSenderId: "979269001667",
            appId: "1:979269001667:web:1d31ac563de1cf2eba1d76",
            measurementId: "G-WDDT7857D0"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        window.db = db;
        window.ref = ref;
        window.set = set;
        window.onValue = onValue;
        window.push = push;
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background-image: url('main-bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 0.5s ease-in-out;
        }
        
        body.miracle-bg {
            background-image: url('miracle-bg.jpg');
            background-size: cover;
            background-position: center;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 700px;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        body.miracle-bg .container {
            background: rgba(255, 255, 255, 0.92);
        }
        
        h1 { color: #ff4081; font-size: 2em; margin-bottom: 20px; }
        .date { font-size: 1.5em; color: #667eea; margin-bottom: 30px; font-weight: bold; }
        
        .auth-section {
            background: rgba(249, 249, 249, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 2px solid #e0e0e0;
        }
        
        .auth-title { font-size: 1.1em; color: #667eea; margin-bottom: 15px; font-weight: bold; }
        .auth-input { width: 80%; padding: 12px; font-size: 1em; border: 2px solid #ddd; border-radius: 10px; text-align: center; margin-bottom: 15px; }
        .auth-button { background: #667eea; color: white; border: none; padding: 10px 25px; font-size: 1em; border-radius: 10px; cursor: pointer; margin: 5px; }
        .auth-button:hover { transform: scale(1.05); background: #5a67d8; }
        
        .user-info {
            background: #e8f5e9;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 25px;
            display: none;
        }
        .user-name { font-size: 1.2em; color: #2e7d32; font-weight: bold; }
        
        .timer-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            color: white;
            display: none;
        }
        .timer-title { font-size: 0.9em; opacity: 0.9; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        .timer { font-size: 2.5em; font-weight: bold; font-family: 'Courier New', monospace; }
        
        .status {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .status-text { font-size: 1.1em; color: #333; margin-bottom: 10px; }
        .other-status { font-size: 0.95em; color: #666; margin-top: 10px; padding-top: 10px; border-top: 1px solid #ddd; }
        
        .signal {
            background: #ff4081;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            display: none;
        }
        .signal:hover:not(:disabled) { transform: scale(1.05); background: #e91e63; }
        .signal:disabled { background: #ccc; cursor: not-allowed; opacity: 0.7; }
        
        .info { margin-top: 20px; font-size: 0.9em; color: #999; display: none; }
        .ready-badge { display: inline-block; background: #4caf50; color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.9em; margin-top: 10px; }
        
        .miracle-message {
            background: linear-gradient(135deg, #ffd89b 0%, #ff4081 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            font-size: 1.3em;
            font-weight: bold;
            animation: pulse 1s ease-in-out;
            display: none;
        }
        
        .chat-container { margin-top: 30px; border-top: 2px solid #e0e0e0; padding-top: 25px; display: none; }
        .chat-title { font-size: 1.2em; color: #ff4081; margin-bottom: 15px; font-weight: bold; }
        .chat-messages { background: #f9f9f9; border-radius: 15px; padding: 15px; height: 300px; overflow-y: auto; margin-bottom: 15px; text-align: left; }
        .chat-message { margin-bottom: 12px; padding: 8px 12px; border-radius: 10px; max-width: 80%; word-wrap: break-word; }
        .chat-message.my-message { background: #667eea; color: white; margin-left: auto; text-align: right; }
        .chat-message.other-message { background: #f0f0f0; color: #333; margin-right: auto; }
        .chat-sender { font-size: 0.8em; font-weight: bold; margin-bottom: 5px; }
        .chat-time { font-size: 0.7em; opacity: 0.7; margin-top: 5px; }
        .chat-input-area { display: flex; gap: 10px; }
        .chat-input { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 1em; }
        .chat-send { background: #ff4081; color: white; border: none; padding: 12px 25px; border-radius: 10px; cursor: pointer; }
        
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @media (max-width: 480px) {
            .container { padding: 25px; }
            .timer { font-size: 1.5em; letter-spacing: 2px; }
            h1 { font-size: 1.5em; }
            .chat-message { max-width: 95%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Что-то совершенно невероятное</h1>
        <div class="date">14 февраля 2027 года</div>
        
        <div class="auth-section" id="authSection">
            <div class="auth-title">✨ Кто ты? ✨</div>
            <input type="text" class="auth-input" id="usernameInput" placeholder="Введите имя">
            <button class="auth-button" onclick="login()">Войти</button>
        </div>
        
        <div class="user-info" id="userInfo">
            <div class="user-name" id="userNameDisplay"></div>
        </div>
        
        <div class="timer-container" id="timerContainer">
            <div class="timer-title" id="timerTitle">скора уж</div>
            <div class="timer" id="timer">-- ебучих дней -- ебучих часов -- ебучих минут -- ебучих секунд</div>
        </div>
        
        <div class="status" id="statusContainer">
            <div class="status-text" id="statusMessage"></div>
            <div id="otherStatus" class="other-status"></div>
        </div>
        
        <button class="signal" id="signalButton" onclick="sendSignal()" disabled>✨ пхпх ✨</button>
        
        <div class="miracle-message" id="miracleMessage">🌟 НЕВОЗМОЖНОЕ ВОЗМОЖНО! 🌟</div>
        
        <div class="chat-container" id="chatContainer">
            <div class="chat-title">вместо тг</div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="Напишите сообщение...">
                <button class="chat-send" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
        
        <div class="info" id="infoText">Кнопка станет доступна 14 февраля 2027 года.</div>
    </div>

    <script type="module">
        const meetingDate = new Date(2027, 1, 14, 0, 0, 0);
        let currentUser = null;
        
        function isButtonActive() {
            return new Date() >= meetingDate;
        }
        
        function updateTimer() {
            const timerEl = document.getElementById('timer');
            const button = document.getElementById('signalButton');
            const title = document.getElementById('timerTitle');
            
            const now = new Date();
            const diff = meetingDate - now;
            
            if (diff <= 0) {
                timerEl.innerHTML = '🎉 СЕГОДНЯ! 🎉';
                title.innerHTML = 'ВСТРЕЧА НАЧАЛАСЬ';
                button.disabled = false;
                return;
            }
            
            const days = Math.floor(diff / (1000*60*60*24));
            const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
            const minutes = Math.floor((diff % (1000*60*60)) / (1000*60));
            const seconds = Math.floor((diff % (1000*60)) / 1000);
            timerEl.innerHTML = `${days} дн ${hours} ч ${minutes} мин ${seconds} сек`;
            title.innerHTML = days > 30 ? 'ДО ВСТРЕЧИ ОСТАЛОСЬ' : '⚡ СКОРО ВСТРЕЧА! ⚡';
            button.disabled = true;
        }
        
        function updateStatus() {
            if (!currentUser) return;
            
            const otherUser = currentUser === 'Ася' ? 'Свят' : 'Ася';
            const signalsRef = window.ref(window.db, 'signals');
            
            window.onValue(signalsRef, (snapshot) => {
                const signals = snapshot.val() || {};
                const mySignal = signals[currentUser];
                const otherSignal = signals[otherUser];
                
                const statusMsg = document.getElementById('statusMessage');
                const otherDiv = document.getElementById('otherStatus');
                const miracleMsg = document.getElementById('miracleMessage');
                const chatContainer = document.getElementById('chatContainer');
                const body = document.body;
                
                if (mySignal) {
                    statusMsg.innerHTML = `✅ Вы отметились! (${mySignal.time})`;
                    if (otherSignal) {
                        otherDiv.innerHTML = `<div class="ready-badge">❤️ ${otherUser} уже здесь! (${otherSignal.time})</div>`;
                        if (miracleMsg.style.display !== 'block') {
                            miracleMsg.style.display = 'block';
                            chatContainer.style.display = 'block';
                            body.classList.add('miracle-bg');
                            loadMessages();
                            setTimeout(() => { 
                                miracleMsg.style.display = 'none';
                            }, 10000);
                        }
                    } else {
                        otherDiv.innerHTML = `<div class="ready-badge">⏳ ${otherUser} ещё не отметился(ась)</div>`;
                    }
                } else {
                    statusMsg.innerHTML = `❌ Вы ещё не отметились`;
                    otherDiv.innerHTML = '';
                }
            });
        }
        
        async function sendSignal() {
            if (!currentUser) return alert('Сначала войдите!');
            if (!isButtonActive()) return alert('Кнопка станет доступна 14 февраля 2027 года!');
            
            const signalsRef = window.ref(window.db, `signals/${currentUser}`);
            const snapshot = await new Promise(resolve => {
                window.onValue(signalsRef, resolve, { onlyOnce: true });
            });
            
            if (snapshot.exists()) {
                alert('Вы уже отметились!');
                return;
            }
            
            const now = new Date();
            await window.set(signalsRef, {
                user: currentUser,
                time: now.toLocaleString('ru-RU'),
                timestamp: now.getTime()
            });
            
            updateStatus();
            
            const otherUser = currentUser === 'Ася' ? 'Свят' : 'Ася';
            const otherRef = window.ref(window.db, `signals/${otherUser}`);
            const otherSnapshot = await new Promise(resolve => {
                window.onValue(otherRef, resolve, { onlyOnce: true });
            });
            
            if (otherSnapshot.exists()) {
                alert(`✨ ЧУДО! ${otherUser} тоже здесь! ✨`);
            } else {
                alert('✅ Вы отметились!');
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message || !currentUser) return;
            
            const signalsRef = window.ref(window.db, 'signals');
            const snapshot = await new Promise(resolve => {
                window.onValue(signalsRef, resolve, { onlyOnce: true });
            });
            const signals = snapshot.val() || {};
            const otherUser = currentUser === 'Ася' ? 'Свят' : 'Ася';
            
            if (!signals[currentUser] || !signals[otherUser]) {
                alert('Чат доступен только после того, как вы оба нажмёте "Я здесь!"');
                return;
            }
            
            const messagesRef = window.ref(window.db, 'messages');
            await window.push(messagesRef, {
                user: currentUser,
                message: message,
                time: new Date().toLocaleString('ru-RU'),
                timestamp: Date.now()
            });
            
            input.value = '';
        }
        
        function loadMessages() {
            if (!currentUser) return;
            
            const messagesRef = window.ref(window.db, 'messages');
            window.onValue(messagesRef, (snapshot) => {
                const messages = snapshot.val() || {};
                const messagesArray = Object.values(messages).sort((a,b) => a.timestamp - b.timestamp);
                const container = document.getElementById('chatMessages');
                container.innerHTML = '';
                
                messagesArray.forEach(msg => {
                    const div = document.createElement('div');
                    div.className = `chat-message ${msg.user === currentUser ? 'my-message' : 'other-message'}`;
                    div.innerHTML = `<div class="chat-sender">${msg.user}</div><div>${escapeHtml(msg.message)}</div><div class="chat-time">${msg.time}</div>`;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            });
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function login() {
            const name = document.getElementById('usernameInput').value.trim();
            if (name !== 'Ася' && name !== 'Свят') {
                alert('Неверное имя');
                return;
            }
            
            currentUser = name;
            localStorage.setItem('currentUser', currentUser);
            
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('userInfo').style.display = 'block';
            document.getElementById('timerContainer').style.display = 'block';
            document.getElementById('statusContainer').style.display = 'block';
            document.getElementById('signalButton').style.display = 'inline-block';
            document.getElementById('infoText').style.display = 'block';
            document.getElementById('userNameDisplay').innerHTML = `👤 Вы вошли как: ${currentUser}`;
            
            updateTimer();
            updateStatus();
            loadMessages();
            setInterval(updateTimer, 1000);
            setInterval(updateStatus, 2000);
        }
        
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser && (savedUser === 'Ася' || savedUser === 'Свят')) {
            login();
        }
        
        window.login = login;
        window.sendSignal = sendSignal;
        window.sendMessage = sendMessage;
    </script>
</body>
</html>
